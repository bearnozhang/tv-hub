name: deploy

# 每次推 main 且 public/scripts/config 变化时，自动把最新产物发布到 Cloudflare Workers
# 需要在仓库 Secrets 里配置 CLOUDFLARE_API_TOKEN（非空，可编辑 Cloudflare Workers 的 token）
"on":
  push:
    branches: [main]
    paths:
      - public/**
      - scripts/**
      - config/**
      - worker-no-compress.js
      - wrangler.toml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # public/ 由 update.yml 构建产出（scripts/build.py → merge.write_cfg 已做契约消毒）。
      #
      # 本 workflow 只部署、不改内容 —— 这样「仓库里的产物」与「线上产物」始终一致。
      # 从前这里用 --inplace 就地消毒，会导致仓库与线上内容不一致，已改为只校验。
      #
      # 契约校验不通过 = 有人绕过了 update 流程提交了脏产物 → 拒绝部署并报错，
      # 让线上保持上一个好版本，而不是把坏东西发出去。
      - name: 内核契约校验（不通过则拒绝部署）
        run: python scripts/sanitize.py public --check --quiet

      - name: Deploy to Cloudflare Wrangler
        run: |
          npm i -g wrangler@latest
          CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" wrangler deploy
