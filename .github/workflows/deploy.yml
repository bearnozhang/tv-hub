name: deploy

# 每次推 main 且 public/scripts/config 变化时，自动把最新产物发布到 Cloudflare Workers
# 需要在仓库 Secrets 里配置 CLOUDFLARE_API_TOKEN（非空，可编辑 Cloudflare Workers 的 token）
"on":
  push:
    branches: [main]
    paths:
      - public/**
      - scripts/**
      - config/**
      - worker-no-compress.js
      - wrangler.toml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 不再 build：public/ 已经是上游原始文件（hebi_tvbox.json / live.txt）
      #
      # ★ 但上游原始文件本身带字段类型冲突，必须消毒后才能部署 ——
      #   实测（2026-10-05）：/tv 有 35 处冲突 → 客户端报「解析配置失败」。
      #   详见下一步骤的注释与 scripts/sanitize.py。
      - name: 内核契约消毒（消除解析失败根因）
        run: python scripts/sanitize.py public --inplace

      - name: 复核（消毒后必须无冲突）
        run: python scripts/sanitize.py public --check --quiet

      - name: Deploy to Cloudflare Wrangler
        run: |
          npm i -g wrangler@latest
          CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" wrangler deploy
